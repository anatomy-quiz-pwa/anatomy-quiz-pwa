<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Book Feedback 模擬器 — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; background: #fafaf7; color: #1a1a1a; line-height: 1.6; }
header { background: #1a1a1a; color: #fff; padding: 18px 28px; position: sticky; top: 0; z-index: 10; }
header h1 { margin: 0; font-size: 20px; display: inline; }
header .subtitle { color: #999; font-size: 13px; margin-left: 12px; }
.demo-banner { background: #f4e3a3; color: #5a4400; padding: 10px 20px; font-size: 14px; border-bottom: 1px solid #d4b860; }
.demo-banner strong { color: #4a3300; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px; }
.panel { background: #fff; border: 1px solid #e5e3da; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
.panel h2 { margin: 0 0 16px 0; font-size: 18px; }
.panel h3 { margin: 16px 0 8px 0; font-size: 15px; color: #555; }
button { padding: 10px 18px; border: 0; border-radius: 5px; font-size: 14px; cursor: pointer; background: #2a4a2a; color: #fff; }
button:disabled { background: #999; cursor: not-allowed; opacity: 0.7; }
button.secondary { background: #6a6a6a; }
.session-item { padding: 12px 14px; border: 1px solid #e5e3da; border-radius: 6px; background: #2a4a2a; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.session-item .meta { font-size: 12px; color: #b0d0b0; }
.version-tab { padding: 6px 12px; border: 1px solid #d0cdc0; border-radius: 5px; background: #2a4a2a; color: #fff; font-size: 13px; display: inline-block; margin-right: 8px; }
.markdown-body { line-height: 1.8; font-size: 15px; padding: 8px 4px; }
.markdown-body h1 { font-size: 24px; margin-top: 0; padding-bottom: 12px; border-bottom: 2px solid #1a1a1a; }
.markdown-body h2 { font-size: 19px; margin-top: 32px; padding-bottom: 6px; border-bottom: 1px solid #d8d6cc; }
.markdown-body h3 { font-size: 16px; margin-top: 22px; color: #333; }
.markdown-body blockquote { margin: 12px 0; padding: 10px 16px; background: #f4f8f4; border-left: 4px solid #2a4a2a; color: #2a4a2a; font-style: italic; }
.markdown-body table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
.markdown-body th, .markdown-body td { border: 1px solid #d8d6cc; padding: 8px 12px; text-align: left; vertical-align: top; }
.markdown-body th { background: #f4f2ec; }
.markdown-body code { background: #f4f2ec; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
.markdown-body strong { color: #1a1a1a; }
.markdown-body ul, .markdown-body ol { padding-left: 24px; }
.markdown-body li { margin: 4px 0; }
.help { font-size: 12px; color: #888; }
details summary { cursor: pointer; padding: 6px 0; font-weight: 500; color: #555; }
.passage-box { background: #f9f7f0; border: 1px dashed #d4b860; padding: 16px; border-radius: 6px; margin: 12px 0; line-height: 1.9; font-size: 14px; white-space: pre-wrap; }
#boot { padding: 40px; text-align: center; color: #888; }
</style>
</head>
<body>
<header><h1>📚 Book Feedback 模擬器</h1><span class="subtitle">25 persona × Claude Opus 4.7 — 唯讀 Demo</span></header>
<div class="demo-banner">⚠️ <strong>Demo 模式（唯讀）</strong> — 預先烘焙了《骨頭》第 3 章 v1 的真實模擬結果。要實際跑 v2/v3 需在本機跑後端。</div>
<div id="boot">⏳ 載入中...</div>
<div id="app" class="container" style="display:none">
  <div class="panel">
    <h2>📁 Session</h2>
    <div class="session-item">
      <div><div><strong id="sn"></strong></div><div class="meta" id="sm"></div></div>
      <div class="meta" id="sd"></div>
    </div>
    <div class="help" style="margin-top:8px"><strong>session 目標</strong>：<span id="sg"></span></div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span class="version-tab">v1</span>
      <button class="secondary" onclick="showPersonas()">查看 25 persona</button>
    </div>
    <details><summary>📄 v1 試寫段落</summary><div class="passage-box" id="pa"></div></details>
    <div id="card"></div>
  </div>
  <div class="panel" style="background:#f9f7f0;border-style:dashed">
    <h2>📖 關於</h2>
    <p style="font-size:14px;color:#555">25 個虛擬讀者（6 中 + 8 英 + 4 日 + 4 編輯 + 3 書評）讀同一段試寫，聚合成「修書工作清單」。本 demo 的 v1 是設計來踩雷的「日本跪坐」段落，系統正確抓出『痛是身為日本女人的一部分，像四季更迭』作為地雷單句。</p>
  </div>
</div>
<script>
let META = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function boot() {
  const b = document.getElementById('boot');
  try {
    b.textContent = '⏳ 載入 meta...';
    META = await (await fetch('./meta.json')).json();
    b.textContent = '⏳ 載入 result card (3 chunks)...';
    const [c1,c2,c3] = await Promise.all([
      fetch('./card1.md').then(r=>r.text()),
      fetch('./card2.md').then(r=>r.text()),
      fetch('./card3.md').then(r=>r.text()),
    ]);
    const md = c1 + "\n\n" + c2 + "\n\n" + c3;
    document.getElementById('sn').textContent = META.name;
    document.getElementById('sm').textContent = `${META.session_id} · 1 個版本 · ✓ persona ready`;
    document.getElementById('sd').textContent = META.created_at.split('T')[0];
    document.getElementById('sg').textContent = META.session_goal || '（未設定）';
    document.getElementById('pa').textContent = META.passage;
    if (typeof marked !== 'undefined') {
      document.getElementById('card').innerHTML = `<div class="markdown-body">${marked.parse(md)}</div>`;
    } else {
      document.getElementById('card').innerHTML = `<pre style="white-space:pre-wrap;font-size:13px">${esc(md)}</pre>`;
    }
    b.style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch (e) {
    b.innerHTML = `<div style="color:#aa3a3a">啟動失敗：${esc(e.message)}</div>`;
  }
}
function showPersonas() {
  const w = window.open('', '_blank');
  w.document.write(`<title>25 personas</title><pre style="font-family:ui-monospace,monospace;padding:20px;background:#1a1a1a;color:#dfd;font-size:12px;line-height:1.6;white-space:pre-wrap">${esc(JSON.stringify(META.personas, null, 2))}</pre>`);
}
boot();
</script>
</body>
</html>
